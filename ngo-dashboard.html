<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NGO Dashboard | ClearGive</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="index.html">Clear<span>Give</span></a><nav><a href="index.html">Donor dashboard</a><button id="logout">Log out</button></nav></header><main><section class="portal-hero"><div><p class="eyebrow">NGO DASHBOARD</p><h1>Record an <em>update.</em></h1><p class="hero-copy">Add campaign, donation, and expense records for donors to view.</p></div></section><section class="section manager"><div><p class="eyebrow">RECORD DATA</p><h2>Keep funds transparent.</h2><p>All entries immediately appear on the public donor dashboard.</p></div><div class="form-panel"><div class="tabs"><button class="tab active" data-form="campaignForm">Campaign</button><button class="tab" data-form="donationForm">Donation</button><button class="tab" data-form="expenseForm">Expense</button></div><form id="campaignForm" class="entry-form active"><label>Campaign name<input name="name" required></label><label>Description<textarea name="description" required></textarea></label><label>Goal amount (₹)<input name="goal" type="number" min="1" required></label><button>Add campaign</button></form><form id="donationForm" class="entry-form"><label>Campaign<select name="campaignId" class="campaign-select" required></select></label><label>Donor name<input name="donorName" placeholder="Anonymous"></label><label>Amount (₹)<input name="amount" type="number" min="1" required></label><label>Date<input name="donatedOn" type="date" required></label><button>Record donation</button></form><form id="expenseForm" class="entry-form"><label>Campaign<select name="campaignId" class="campaign-select" required></select></label><label>Item purchased<input name="itemName" required></label><label>Category<select name="category"><option>Medical</option><option>Education</option><option>Food</option><option>Admin</option><option>Other</option></select></label><label>Amount (₹)<input name="amount" type="number" min="1" required></label><label>Date<input name="spentOn" type="date" required></label><button>Record expense</button></form><p id="message"></p></div></section></main><script src="ngo.js"></script></body></html>
